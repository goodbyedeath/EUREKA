<!-- public/offline.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EUREKA - Offline</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 400px;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        h1 {
            margin: 0 0 1rem 0;
            font-size: 2rem;
            font-weight: 300;
        }
        p {
            margin: 0 0 2rem 0;
            opacity: 0.8;
            line-height: 1.6;
        }
        .retry-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .retry-btn:hover {
            background: white;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡❌</div>
        <h1>You're Offline</h1>
        <p>No internet connection detected, but EUREKA still works offline!</p>
        
        <div style="background: rgba(0,0,0,0.2); padding: 1.5rem; border-radius: 15px; margin: 1.5rem 0; text-align: left;">
            <h3 style="margin-top: 0; color: #FFD700;">🔋 Available Offline:</h3>
            <ul style="list-style: none; padding: 0;">
                <li style="padding: 0.3rem 0;">✓ Dashboard (cached data)</li>
                <li style="padding: 0.3rem 0;">✓ Team information</li>
                <li style="padding: 0.3rem 0;">✓ Quiz attempts (saved locally)</li>
                <li style="padding: 0.3rem 0;">✓ Quest locations</li>
                <li style="padding: 0.3rem 0;">✓ LED kiosk display</li>
            </ul>
        </div>
        
        <div style="margin: 1rem 0;">
            <button class="retry-btn" onclick="window.location.reload()" style="margin: 0.5rem;">
                🔄 Try Again
            </button>
            <button class="retry-btn" onclick="window.location.href='/user/dashboard'" style="margin: 0.5rem;">
                📊 Dashboard
            </button>
        </div>
    </div>
    
    <script>
        // Auto-retry when online
        window.addEventListener('online', function() {
            window.location.reload();
        });
    </script>
</body>
</html>
