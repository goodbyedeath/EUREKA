<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Test</title>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .timer { background: #f0f0f0; padding: 20px; border-radius: 8px; margin: 20px 0; }
        .warning { color: red; font-weight: bold; }
        .normal { color: blue; }
    </style>
</head>
<body>
    <h1>Quiz Timer Test</h1>
    
    <script>
        // Test the timer functionality with mock data
        window.quizStartTime = Math.floor(Date.now() / 1000) - 60; // Started 1 minute ago
        window.timeLimitSeconds = 300; // 5 minutes total
        window.isQuizCompleted = false;

        console.log('Timer test initialization:', {
            quizStartTime: window.quizStartTime,
            timeLimitSeconds: window.timeLimitSeconds,
            isQuizCompleted: window.isQuizCompleted
        });

        window.countdownTimer = function(initialSeconds, questionnaireId) {
            return {
                timeRemaining: initialSeconds,
                displayTime: '',
                isWarning: false,
                timerInterval: null,
                
                init() {
                    console.log('Timer init called with:', initialSeconds, questionnaireId);
                    
                    if (!window.timeLimitSeconds || !window.quizStartTime || window.isQuizCompleted) {
                        console.warn('Timer initialization skipped:', {
                            timeLimitSeconds: window.timeLimitSeconds,
                            quizStartTime: window.quizStartTime,
                            isQuizCompleted: window.isQuizCompleted
                        });
                        this.displayTime = this.timeRemaining > 0 ? this.formatTime(this.timeRemaining) : '0:00';
                        return;
                    }
                    
                    this.updateDisplay();
                    this.startTimer();
                },
                
                formatTime(seconds) {
                    const minutes = Math.floor(Math.max(0, seconds) / 60);
                    const secs = Math.max(0, seconds) % 60;
                    return `${minutes}:${secs.toString().padStart(2, '0')}`;
                },
                
                startTimer() {
                    if (this.timerInterval) {
                        clearInterval(this.timerInterval);
                    }
                    
                    this.timerInterval = setInterval(() => {
                        if (window.isQuizCompleted) {
                            this.stopTimer();
                            return;
                        }
                        
                        this.calculateTimeRemaining();
                        this.updateDisplay();
                        
                        if (this.timeRemaining <= 0) {
                            this.handleTimeExpiry();
                        }
                    }, 1000);
                },
                
                calculateTimeRemaining() {
                    if (!window.timeLimitSeconds || !window.quizStartTime) {
                        console.warn('Invalid timer data');
                        return;
                    }
                    
                    const currentTime = Math.floor(Date.now() / 1000);
                    const elapsed = currentTime - window.quizStartTime;
                    this.timeRemaining = Math.max(0, window.timeLimitSeconds - elapsed);
                    
                    console.log('Timer update:', {
                        currentTime,
                        elapsed,
                        timeRemaining: this.timeRemaining
                    });
                },
                
                updateDisplay() {
                    this.displayTime = this.formatTime(this.timeRemaining);
                    this.isWarning = this.timeRemaining <= 60 && this.timeRemaining > 0; // Warning at 1 minute
                },
                
                handleTimeExpiry() {
                    this.stopTimer();
                    this.timeRemaining = 0;
                    this.updateDisplay();
                    alert('Time is up! Quiz would be submitted automatically.');
                },
                
                stopTimer() {
                    if (this.timerInterval) {
                        clearInterval(this.timerInterval);
                        this.timerInterval = null;
                    }
                }
            }
        }
    </script>

    <div class="timer">
        <h3>Timer Component Test</h3>
        <div x-data="countdownTimer(240, 'test')" x-init="init()">
            <div class="display">
                <span x-text="'Time Remaining: ' + displayTime" 
                      :class="isWarning ? 'warning' : 'normal'"></span>
            </div>
            <div style="margin-top: 10px;">
                <span x-text="'Warning Mode: ' + (isWarning ? 'YES' : 'NO')"></span>
            </div>
        </div>
    </div>

    <div class="timer">
        <h3>Manual Test Controls</h3>
        <button onclick="window.isQuizCompleted = true; console.log('Quiz marked as completed')">
            Mark Quiz Complete
        </button>
        <button onclick="window.isQuizCompleted = false; console.log('Quiz marked as incomplete')">
            Mark Quiz Incomplete
        </button>
    </div>

    <div class="timer">
        <h3>Console Output</h3>
        <p>Check the browser console (F12) for detailed timer logs and any errors.</p>
    </div>
</body>
</html>
