# EUREKA — TLS, static files, and PHP-FPM.
#
# The LAN plan in SCALING-PLAN.md §5 matters here: the phones resolve questerra-series.com to this box, so
# the certificate must be valid for that name. Bring the stack up on port 80 first, get the certificate
# (DNS-01, the venue has an uplink), then uncomment the TLS server block.

upstream php {
    server app:9000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 24m;          # must match post_max_size in php.ini
    client_body_timeout 60s;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    # Tiles, models and pictures are served by nginx, never by PHP — that is most of the Sync burst
    # (SCALING-PLAN.md §3c) handled without touching the application.
    location ~* ^/(storage|build|vendor|images|js|css)/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 65s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known) { deny all; }
}

