; Opcache was NOT loaded on the shared host (SCALING-PLAN.md §10). Here it is ours to set, and it is the
; cheapest latency this stack will ever buy: without it every request recompiles ~1,500 PHP files.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 24
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit = disable

; validate_timestamps=0 is why the image is immutable: PHP will never notice an edited file inside a
; running container. Deploy by rebuilding and restarting, not by editing. That is the point.
