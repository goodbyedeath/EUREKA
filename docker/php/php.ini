; EUREKA runtime. The numbers here come from the measurements in SCALING-PLAN.md, not from a template.
memory_limit = 256M

; A verification photo arrives as base64 inside a JSON body, so the ceiling is the POST body, not an
; upload field. 6 MB of photo becomes ~8 MB of base64; 24 MB leaves room for a 3D model upload from the
; admin without letting a 200 MB body through.
post_max_size = 24M
upload_max_filesize = 16M
max_file_uploads = 30

; A request that is still running after 60 s is a request nobody is waiting for any more.
max_execution_time = 60
max_input_time = 60

expose_php = Off
date.timezone = UTC

; The archive ZIP streams from disk, so this is for the odd admin page that holds a snapshot in memory.
realpath_cache_size = 4096k
realpath_cache_ttl = 600
