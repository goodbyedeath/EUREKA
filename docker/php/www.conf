[www]
; Little's law, not a guess: ~1,000 req/s at a 20 ms p95 needs about 20 workers busy at once
; (SCALING-PLAN.md §4). 100 per container, two containers, is burst headroom of 10x.
pm = static
pm.max_children = 100
pm.max_requests = 2000

; Children are recycled, so a slow leak cannot run the box out of memory over an eight-hour event.
request_terminate_timeout = 65s

catch_workers_output = yes
decorate_workers_output = no
clear_env = no

; A slow request is logged with its PHP stack rather than guessed at afterwards.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s
